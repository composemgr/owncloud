name: owncloud
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: owncloud/server:latest
    container_name: owncloud-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: owncloud-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      OC_EXE: php
      NEXTCLOUD_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASS: ${APP_ADMIN_PASS:-changeme_admin_password}
      NEXTCLOUD_MAIL_DOMAIN: ${BASE_HOST_NAME:-$HOSTNAME}
      NEXTCLOUD_MAIL_FROM_ADDRESS: ${EMAIL_SERVER_MAIL_FROM:-no-reply}
      NEXTCLOUD_MAIL_SMTP_ADDRESS: ${EMAIL_SERVER_HOST:-172.17.0.1}
      NEXTCLOUD_MAIL_SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      NEXTCLOUD_MAIL_SMTP_NAME: ${EMAIL_SERVER_HOST:-172.17.0.1}
      NEXTCLOUD_MAIL_SMTP_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      NEXTCLOUD_MAIL_SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      NEXTCLOUD_MAIL_SMTP_SECURE: ${EMAIL_SERVER_USE_SSL:-true}
      REDIS_HOST: owncloud-redis
      TRUSTED_PROXIES: 172.17.0.1/16
      TRUSTED_DOMAINS: ${BASE_HOST_NAME:-$HOSTNAME}
      OVERWRITEHOST: ${BASE_HOST_NAME:-$HOSTNAME}
      OVERWRITEPROTOCOL: https
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/owncloud:/var/www/html:z'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.owncloud-server.entrypoints=http'
      - 'traefik.http.routers.owncloud-server.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.owncloud-server.middlewares=owncloud-server-https-redirect'
      - 'traefik.http.middlewares.owncloud-server-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.owncloud-server-secure.entrypoints=https'
      - 'traefik.http.routers.owncloud-server-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.owncloud-server-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.owncloud-server-secure.service=owncloud-server'
      - 'traefik.http.services.owncloud-server.loadbalancer.server.port=8080'
    networks:
      - owncloud
      - traefik

  db:
    image: mariadb:latest
    container_name: owncloud-db
    hostname: owncloud-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: owncloud-db
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INIT_SKIP_TZINFO: "1"
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-owncloud}
      MARIADB_USER: ${DB_USER_NAME:-owncloud}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - './volumes/db/mariadb/owncloud:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - owncloud

  redis:
    image: redis:alpine
    container_name: owncloud-redis
    hostname: owncloud-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: owncloud-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_password}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - owncloud

networks:
  owncloud:
    name: owncloud
    external: false
  traefik:
    external: true
